<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Mohammad sadegh GitHub profile">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C2E"/></linearGradient>
 <linearGradient id="accent"><stop offset="0" stop-color="#60A5FA"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
 <style>
 text{font-family:Inter,'Segoe UI',Arial,sans-serif}
 .heading{font-size:23px;font-weight:700;fill:#F1F5F9}
 .label{font-size:12px;font-weight:600;letter-spacing:2px;fill:#9AAAC0}
 .value{font-size:30px;font-weight:750;fill:#F1F5F9}
 .small{font-size:13px;fill:#9AAAC0}
 .glow{animation:glow 4s ease-in-out infinite}
 .sweep{animation:sweep 7s ease-in-out infinite}
 @keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
 @keyframes sweep{0%,65%{transform:translateX(-260px);opacity:0}75%{opacity:.75}100%{transform:translateX(1200px);opacity:0}}
 @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
 </style>
</defs>
<rect x="1" y="1" width="998" height="248" rx="20" fill="url(#bg)" stroke="#263750"/>

<circle cx="865" cy="124" r="92" fill="#60A5FA" opacity=".08" class="glow"/>
<circle cx="865" cy="124" r="65" fill="none" stroke="#22D3EE" stroke-opacity=".55"/>
<circle cx="865" cy="124" r="46" fill="none" stroke="#F472B6" stroke-opacity=".4" stroke-dasharray="5 8">
 <animateTransform attributeName="transform" type="rotate" from="0 865 124" to="360 865 124" dur="28s" repeatCount="indefinite"/>
</circle>
<text x="42" y="52" class="label">HELLO, I'M</text>
<text x="42" y="112" font-size="43" font-weight="750" fill="#F1F5F9">Mohammad sadegh</text>
<text x="44" y="151" font-size="18" fill="#22D3EE">JavaScript · Node.js · Backend Development</text>
<text x="44" y="184" font-size="15" fill="#9AAAC0">Back-end(Nodejs) ^Dev 💻</text>
<text x="44" y="218" font-size="12" fill="#9AAAC0">@Mohammadsdq · github.com/Mohammadsdq</text>
<rect class="sweep" x="0" y="0" width="100" height="250" fill="url(#accent)" opacity=".12"/>
</svg>